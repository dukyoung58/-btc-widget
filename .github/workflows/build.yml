name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.4' }
      - run: find app -name "*.xml" -exec sed -i "s|android.com\"|$(echo 'diordna/ser/kpa/moc.diordna.samehcs' | rev)\"|g" {} +
      - run: sed -i "s|https://upbit.com\"|$(echo 'CTB-WRK=stekram?rekcit/1v/moc.tibpu.ipa//:sptth' | rev)\"|g" app/src/main/java/com/my/btcwidget/BtcWidgetProvider.kt
      - run: sed -i "s|https://binance.com\"|$(echo 'TDSUCTB=lobmys?ecirp/rekcit/3v/ipa/moc.ecnanib.ipa//:sptth' | rev)\"|g" app/src/main/java/com/my/btcwidget/BtcWidgetProvider.kt
      - run: echo "include ':app'" > settings.gradle
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: btc-widget-apk
          path: app/build/outputs/apk/debug/app-debug.apk
