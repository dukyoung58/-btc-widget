name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.4' }
      - run: find app -name "*.xml" -exec sed -i "s|android.com\"|$(echo 'diordna/ser/kpa/moc.diordna.samehcs' | rev)\"|g" {} +
      - run: python3 -c 'p="app/src/main/AndroidManifest.xml"; s=open(p).read(); a="and"+"roid:name"; t=chr(60)+"uses-permission "+a+"=\"android.permission.INTERNET\"/"+chr(62); open(p,"w").write(s.replace(chr(60)+"application", t+"\n"+chr(60)+"application"))'
      - run: echo "include ':app'" > settings.gradle
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: btc-widget-apk
          path: app/build/outputs/apk/debug/app-debug.apk
